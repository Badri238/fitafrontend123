<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    .c{
        color:yellow;
    }
</style>
<body>
    
    <p id="p1"></p>
    <button id="btn1" onclick="getAPI()">Write</button>

    <div id="d1">

    </div>
     <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script>
        async function getAPI(){
            let data =  await fetch("https://jsonplaceholder.typicode.com/user")
            .then((res)=> res.json());
            console.log(data)
            fetch("https://jsonplaceholder.typicode.com/users")
            .then((res)=> res.json()).then((re)=>{
            console.log(re);

            for(let i=0;i<re.length;i++){
                let newPtag =document.createElement("p")
                newPtag.innerText = re[i].name;
                document.getElementById("d1").append(newPtag)
            }
        })
        }
      
    </script>
</body>
</html>
